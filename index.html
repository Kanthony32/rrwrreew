<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>No Promises — College Basketball Coach Manager</title>
<style>
:root{--bg:#080b12;--panel:#101624;--panel2:#151d2e;--line:#263248;--text:#f7f2e8;--muted:#9da8bb;--orange:#ff8a2a;--gold:#ffd166;--green:#50d890;--red:#ff5d73;--blue:#65b7ff;--cream:#fff3dc}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#172033 0,#080b12 34%,#05070b 100%);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1280px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:18px}.brand h1{margin:0;font-size:32px;letter-spacing:-.04em}.brand p{margin:4px 0 0;color:var(--muted)}.pill{border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;padding:8px 12px;color:var(--muted);font-size:13px}.nav{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.nav button,.primary,.secondary{border:1px solid var(--line);border-radius:14px;background:#11192a;color:var(--text);padding:10px 13px}.nav button.active,.primary{background:linear-gradient(135deg,var(--orange),#ffb13b);color:#17100a;border-color:#ffbc66;font-weight:800}.secondary:hover,.nav button:hover{border-color:#ffb13b}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.026));border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 12px 35px rgba(0,0,0,.24)}.span3{grid-column:span 3}.span4{grid-column:span 4}.span5{grid-column:span 5}.span6{grid-column:span 6}.span7{grid-column:span 7}.span8{grid-column:span 8}.span12{grid-column:span 12}h2,h3{margin:0 0 10px;letter-spacing:-.02em}small,.muted{color:var(--muted)}.metric{margin:10px 0}.metric b{display:flex;justify-content:space-between;font-size:13px}.bar{height:9px;background:#202a3d;border-radius:99px;overflow:hidden;margin-top:5px}.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--orange),var(--gold))}.fill.good{background:linear-gradient(90deg,#28ca78,#8ff0b8)}.fill.bad{background:linear-gradient(90deg,#ff4766,#ffad66)}.feed{display:grid;gap:9px}.item{border:1px solid var(--line);border-radius:14px;padding:11px;background:rgba(0,0,0,.18)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{font-size:12px;padding:5px 8px;border-radius:999px;background:rgba(255,138,42,.12);border:1px solid rgba(255,138,42,.35);color:#ffd2ad}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid var(--line);text-align:left}.table th{color:var(--muted);font-size:12px;text-transform:uppercase}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.choice{width:100%;text-align:left;margin:8px 0;border:1px solid var(--line);background:#11192a;color:var(--text);padding:12px;border-radius:14px}.choice:hover{border-color:var(--orange)}.notice{border-left:4px solid var(--orange);background:rgba(255,138,42,.09);padding:12px;border-radius:12px}.screen{display:none}.screen.active{display:block}.kpi{font-size:30px;font-weight:900;letter-spacing:-.05em}.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}.footer{margin-top:18px;color:var(--muted);font-size:12px;text-align:center}.input{width:100%;background:#0d1320;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:10px;margin:6px 0}.court{position:relative;overflow:hidden}.court:before{content:"";position:absolute;inset:auto -20% -60% -20%;height:240px;border:2px solid rgba(255,138,42,.13);border-radius:50%;pointer-events:none}@media(max-width:900px){.span3,.span4,.span5,.span6,.span7,.span8{grid-column:span 12}.top{display:block}.split{grid-template-columns:1fr}.app{padding:14px}.brand h1{font-size:28px}}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand"><h1>No Promises</h1><p>College Basketball Coach Manager — build the program, earn the trust.</p></div>
    <div class="pill">Phase 5 Web Preview · Local-state prototype</div>
  </div>
  <div class="nav" id="nav"></div>
  <main id="main"></main>
  <div class="footer">Prototype build. Data saves in browser memory/local storage. Online backend + true multiplayer still comes later.</div>
</div>
<script>
const clamp=n=>Math.max(0,Math.min(100,Math.round(n)));
const state={week:1,season:1,view:'Dashboard',record:[0,0],score:0,coach:{name:'Coach KM',level:3,xp:420,archetype:'Builder',badges:['Trust Builder','NIL Discipline']},program:{trust:66,culture:64,prestige:51,adTrust:58,boosterTrust:54,job:63,budget:72,nilFund:48,nilIntegrity:76,fan:57,academics:78,political:52,conference:49,media:43},resources:{texts:5,calls:3,parent:1,hc:1,eval:1,visit:1,portal:2,nil:1,practice:100},log:['Welcome to No Promises. Week 1 staff meeting is live.'],players:[
{name:'Reagan Williams',pos:'W',yr:'JR',ovr:84,pot:92,morale:76,trust:82,nil:63,portal:18,fatigue:22,trait:'Quiet Leader'},
{name:'Damiya Carter',pos:'PG',yr:'SO',ovr:82,pot:91,morale:68,trust:74,nil:55,portal:24,fatigue:29,trait:'Film Junkie'},
{name:'Lex Harper',pos:'F',yr:'SR',ovr:86,pot:88,morale:71,trust:70,nil:59,portal:12,fatigue:35,trait:'Alpha'},
{name:'Galima Sato',pos:'F',yr:'FR',ovr:77,pot:93,morale:62,trust:61,nil:45,portal:33,fatigue:18,trait:'Late Bloomer'},
{name:'Bre Morgan',pos:'G',yr:'JR',ovr:81,pot:86,morale:64,trust:58,nil:70,portal:39,fatigue:32,trait:'Social Influencer'}],recruits:[
{name:'Jada Ellis',pos:'CG',class:'2027',interest:62,trust:48,fit:84,family:50,risk:22,debt:0,concern:'Playing time clarity',hidden:false},
{name:'Skylar Reed',pos:'W',class:'2027',interest:58,trust:44,fit:76,family:48,risk:28,debt:0,concern:'NIL visibility',hidden:false},
{name:'Maya Brooks',pos:'PG',class:'2028',interest:66,trust:52,fit:88,family:60,risk:16,debt:0,concern:'Belief + development',hidden:false},
{name:'Alina Carter',pos:'F',class:'2027',interest:55,trust:47,fit:70,family:42,risk:31,debt:0,concern:'Clear role path',hidden:false},
{name:'Nia Thompson',pos:'PF',class:'2028',interest:50,trust:46,fit:91,family:64,risk:18,debt:0,concern:'Overwhelmed by process',hidden:false}],portal:[
{name:'Tessa King',pos:'PG',ovr:85,fit:82,ask:18,trust:42,risk:36,status:'available'},
{name:'Morgan Lee',pos:'C',ovr:83,fit:74,ask:12,trust:50,risk:28,status:'available'},
{name:'Aniyah West',pos:'W',ovr:81,fit:88,ask:9,trust:48,risk:22,status:'available'}],staff:[
{name:'Recruiting Coordinator',level:1,cost:10,impact:'More efficient recruit actions'},
{name:'Player Development Lead',level:1,cost:12,impact:'Boosts practice gains'},
{name:'NIL / Brand Director',level:1,cost:14,impact:'Improves NIL integrity and sponsor momentum'},
{name:'Analytics Assistant',level:1,cost:8,impact:'Improves game simulation'}],custom:JSON.parse(localStorage.getItem('np_custom')||'[]'),leaders:JSON.parse(localStorage.getItem('np_leaders')||'[]')};
const views=['Dashboard','Roster','Recruiting','Portal','Practice','Staff','Power','Dynasty','Community'];
function save(){localStorage.setItem('np_custom',JSON.stringify(state.custom));localStorage.setItem('np_leaders',JSON.stringify(state.leaders));}
function nav(){document.getElementById('nav').innerHTML=views.map(v=>`<button class="${state.view===v?'active':''}" onclick="go('${v}')">${v}</button>`).join('')+`<button class="primary" onclick="advanceWeek()">Advance Week</button>`}
function go(v){state.view=v;render()}
function metric(label,val,bad=false){return `<div class="metric"><b><span>${label}</span><span>${val}</span></b><div class="bar"><div class="fill ${bad?'bad':val>70?'good':''}" style="width:${clamp(val)}%"></div></div></div>`}
function render(){nav();document.getElementById('main').innerHTML=({Dashboard,Roster,Recruiting,Portal,Practice,Staff,Power,Dynasty,Community})[state.view]();}
function Dashboard(){let p=state.program;return `<section class="grid"><div class="card span8 court"><h2>Week ${state.week} · Season ${state.season}</h2><p class="muted">Record: ${state.record[0]}-${state.record[1]} · The AD wants growth, not excuses. Your job is to win without creating trust debt.</p><div class="grid"><div class="card span3"><div class="kpi">${p.job}</div><small>Job Security</small></div><div class="card span3"><div class="kpi">${p.trust}</div><small>Trust Capital</small></div><div class="card span3"><div class="kpi">${p.nilIntegrity}</div><small>NIL Integrity</small></div><div class="card span3"><div class="kpi">${p.prestige}</div><small>Prestige</small></div></div></div><div class="card span4"><h3>Staff Meeting</h3><div class="feed"><div class="item">AD: “Show momentum and keep the program clean.”</div><div class="item">Recruiting: “Jada and Maya need real role clarity.”</div><div class="item">NIL: “Do not chase fake numbers.”</div><div class="item">Booster: “Local business group wants visibility.”</div></div></div><div class="card span4">${metric('Culture',p.culture)}${metric('Fan Support',p.fan)}${metric('Academics',p.academics)}${metric('Budget',p.budget,true)}</div><div class="card span4">${metric('AD Trust',p.adTrust)}${metric('Booster Trust',p.boosterTrust)}${metric('Political Capital',p.political)}${metric('Conference Respect',p.conference)}</div><div class="card span4"><h3>Notification Feed</h3><div class="feed">${state.log.slice(-6).reverse().map(x=>`<div class="item">${x}</div>`).join('')}</div></div></section>`}
function Roster(){return `<section class="grid"><div class="card span12"><h2>Roster Management</h2><table class="table"><tr><th>Player</th><th>Pos</th><th>OVR</th><th>Potential</th><th>Morale</th><th>Trust</th><th>NIL</th><th>Portal Risk</th><th>Action</th></tr>${state.players.map((p,i)=>`<tr><td><b>${p.name}</b><br><small>${p.yr} · ${p.trait}</small></td><td>${p.pos}</td><td>${p.ovr}</td><td>${p.pot}</td><td>${p.morale}</td><td>${p.trust}</td><td>${p.nil}</td><td>${p.portal}%</td><td><button class="secondary" onclick="playerTalk(${i})">Meet</button></td></tr>`).join('')}</table></div></section>`}
function playerTalk(i){let p=state.players[i];p.trust=clamp(p.trust+7);p.morale=clamp(p.morale+5);p.portal=clamp(p.portal-8);state.program.trust=clamp(state.program.trust+2);state.log.push(`Player meeting: ${p.name} appreciated the honest role conversation.`);render()}
function Recruiting(){return `<section class="grid"><div class="card span12"><h2>Recruiting Board</h2><p class="muted">Limited resources reset weekly. Generic hype creates debt. Specific plans build trust.</p><table class="table"><tr><th>Recruit</th><th>Interest</th><th>Trust</th><th>Fit</th><th>Family</th><th>Risk</th><th>Debt</th><th>Concern</th><th>Actions</th></tr>${state.recruits.map((r,i)=>`<tr><td><b>${r.name}</b><br><small>${r.class} · ${r.pos}</small></td><td>${r.interest}</td><td>${r.trust}</td><td>${r.fit}</td><td>${r.family}</td><td>${r.risk}</td><td>${r.debt}</td><td>${r.concern}${r.hidden?' · hidden revealed':''}</td><td><button class="secondary" onclick="recruitAction(${i},'plan')">Development Plan</button> <button class="secondary" onclick="recruitAction(${i},'call')">Call</button> <button class="secondary" onclick="recruitAction(${i},'visit')">Visit Invite</button></td></tr>`).join('')}</table></div></section>`}
function recruitAction(i,type){let r=state.recruits[i];if(type==='plan'){r.trust=clamp(r.trust+10);r.interest=clamp(r.interest+5);r.risk=clamp(r.risk-5);r.hidden=true;state.resources.practice=Math.max(0,state.resources.practice-0);state.log.push(`${r.name}: Specific development plan improved trust and clarity.`)}if(type==='call'){r.trust=clamp(r.trust+7);r.family=clamp(r.family+5);r.hidden=true;state.log.push(`${r.name}: Call revealed a deeper concern.`)}if(type==='visit'){if(r.trust<50){r.risk=clamp(r.risk+8);r.debt=clamp(r.debt+6);state.log.push(`${r.name}: Visit invite felt rushed. Trust Debt increased.`)}else{r.interest=clamp(r.interest+12);state.log.push(`${r.name}: Visit invite created momentum.`)}}render()}
function Portal(){return `<section class="grid"><div class="card span7"><h2>Transfer Portal</h2><table class="table"><tr><th>Player</th><th>OVR</th><th>Fit</th><th>NIL Ask</th><th>Trust</th><th>Risk</th><th>Action</th></tr>${state.portal.map((p,i)=>`<tr><td><b>${p.name}</b><br><small>${p.pos} · ${p.status}</small></td><td>${p.ovr}</td><td>${p.fit}</td><td>$${p.ask}k</td><td>${p.trust}</td><td>${p.risk}</td><td><button class="secondary" onclick="portalAction(${i})">Honest Pitch</button></td></tr>`).join('')}</table></div><div class="card span5"><h3>Retention Watch</h3>${state.players.filter(p=>p.portal>25).map(p=>`<div class="item"><b>${p.name}</b><br><small>Portal Risk ${p.portal}% — needs role/NIL clarity.</small></div>`).join('')}</div></section>`}
function portalAction(i){let p=state.portal[i];if(state.program.nilFund>=p.ask){p.trust=clamp(p.trust+18);p.risk=clamp(p.risk-12);state.program.nilFund=clamp(state.program.nilFund-p.ask/2);state.log.push(`Portal: ${p.name} liked the honest role + NIL framework.`);if(p.trust>65&&p.status==='available'){p.status='committed';state.players.push({name:p.name,pos:p.pos,yr:'TR',ovr:p.ovr,pot:p.ovr+5,morale:66,trust:p.trust,nil:62,portal:18,fatigue:10,trait:'Portal Add'});state.program.prestige=clamp(state.program.prestige+4)}}else{state.log.push(`Portal: NIL fund too thin to responsibly pursue ${p.name}.`)}render()}
function Practice(){return `<section class="grid"><div class="card span12"><h2>Practice Planner</h2><p class="muted">Allocate 100 points. Overtraining raises fatigue. Culture work lowers portal risk.</p><div class="split"><div><input id="shoot" class="input" type="number" value="25"><small>Shooting</small><input id="def" class="input" type="number" value="25"><small>Defense</small><input id="reads" class="input" type="number" value="20"><small>Ball Screen Reads</small></div><div><input id="rec" class="input" type="number" value="15"><small>Recovery</small><input id="cult" class="input" type="number" value="15"><small>Culture</small><button class="primary" onclick="applyPractice()">Apply Practice Week</button></div></div></div></section>`}
function applyPractice(){let vals=['shoot','def','reads','rec','cult'].map(id=>+document.getElementById(id).value||0),sum=vals.reduce((a,b)=>a+b,0);if(sum>100){state.log.push('Practice rejected: over 100 points. Discipline matters.');render();return}state.players.forEach(p=>{p.ovr=clamp(p.ovr+(vals[0]+vals[1]+vals[2])/95);p.fatigue=clamp(p.fatigue+Math.max(0,35-vals[3])/6);p.morale=clamp(p.morale+vals[4]/8);p.portal=clamp(p.portal-vals[4]/10)});state.program.culture=clamp(state.program.culture+vals[4]/10);state.log.push('Practice applied: development, fatigue, and culture updated.');render()}
function Staff(){return `<section class="grid"><div class="card span12"><h2>Staff Infrastructure</h2><table class="table"><tr><th>Role</th><th>Level</th><th>Cost</th><th>Impact</th><th></th></tr>${state.staff.map((s,i)=>`<tr><td><b>${s.name}</b></td><td>${s.level}</td><td>${s.cost}</td><td>${s.impact}</td><td><button class="secondary" onclick="upgradeStaff(${i})">Upgrade</button></td></tr>`).join('')}</table></div></section>`}
function upgradeStaff(i){let s=state.staff[i];if(state.program.budget<s.cost){state.log.push('Budget too tight for staff upgrade.');render();return}s.level++;state.program.budget=clamp(state.program.budget-s.cost);state.program.staff=clamp((state.program.staff||50)+5);state.log.push(`${s.name} upgraded. Infrastructure matters.`);render()}
function Power(){let p=state.program;return `<section class="grid"><div class="card span6"><h2>Athletic Director</h2>${metric('AD Trust',p.adTrust)}${metric('AD Patience',Math.max(0,100-state.week*7))}${metric('Job Security',p.job)}<button class="primary" onclick="powerMove('ad')">Present Program Plan</button></div><div class="card span6"><h2>Boosters + Media</h2>${metric('Booster Trust',p.boosterTrust)}${metric('Media Buzz',p.media)}${metric('Political Capital',p.political)}<button class="primary" onclick="powerMove('booster')">Host Booster Dinner</button> <button class="secondary" onclick="powerMove('media')">Do Media Hit</button></div></section>`}
function powerMove(type){let p=state.program;if(type==='ad'){p.adTrust=clamp(p.adTrust+8);p.job=clamp(p.job+5);p.political=clamp(p.political+4);state.log.push('AD liked the clear plan: development, retention, and realistic recruiting.')}if(type==='booster'){p.boosterTrust=clamp(p.boosterTrust+9);p.budget=clamp(p.budget+5);p.fan=clamp(p.fan+3);state.log.push('Booster dinner raised trust but created expectation pressure.')}if(type==='media'){p.media=clamp(p.media+10);p.fan=clamp(p.fan+6);p.pressure=clamp((p.pressure||25)+5);state.log.push('Media hit helped buzz. Public pressure rises too.')}render()}
function Dynasty(){return `<section class="grid"><div class="card span7"><h2>Dynasty Mode</h2><p class="muted">Season ${state.season}. Build legacy over multiple years. Job offers unlock as prestige and trust rise.</p><div class="grid"><div class="card span4"><div class="kpi">${state.coach.level}</div><small>Coach Level</small></div><div class="card span4"><div class="kpi">${state.coach.xp}</div><small>XP</small></div><div class="card span4"><div class="kpi">${state.program.prestige}</div><small>Prestige</small></div></div><button class="primary" onclick="offseason()">Run Offseason</button></div><div class="card span5"><h3>Legacy Badges</h3>${state.coach.badges.map(b=>`<span class="tag">${b}</span>`).join(' ')}<div class="notice" style="margin-top:14px">Hall of Fame trajectory requires wins, culture, retention, clean NIL, and trust capital. Charm alone will not survive March.</div></div></section>`}
function offseason(){state.season++;state.week=1;state.coach.xp+=160;state.coach.level=Math.floor(state.coach.xp/250)+1;state.program.prestige=clamp(state.program.prestige+state.record[0]*2-state.record[1]);state.record=[0,0];state.log.push('Offseason complete: seniors graduated, portal buzz reset, new season begins.');render()}
function Community(){return `<section class="grid"><div class="card span6"><h2>Challenge + Share</h2><button class="primary" onclick="challenge('Trust Rebuild')">Start Trust Rebuild</button> <button class="secondary" onclick="challenge('NIL Chaos')">Start NIL Chaos</button> <button class="secondary" onclick="exportSave()">Export Save Code</button><textarea id="share" class="input" rows="6" placeholder="Share codes appear here"></textarea></div><div class="card span6"><h2>Custom Content</h2><input id="customName" class="input" placeholder="Custom recruit / school / challenge name"><button class="primary" onclick="addCustom()">Add Custom Item</button><div class="feed">${state.custom.map(x=>`<div class="item">${x}</div>`).join('')}</div></div><div class="card span12"><h2>Local Leaderboard</h2><button class="secondary" onclick="saveScore()">Save Current Score</button><table class="table"><tr><th>Coach</th><th>Score</th><th>Archetype</th></tr>${state.leaders.map(l=>`<tr><td>${l.name}</td><td>${l.score}</td><td>${l.arch}</td></tr>`).join('')}</table></div></section>`}
function challenge(name){state.log.push(`Challenge started: ${name}.`);if(name==='NIL Chaos'){state.program.nilFund=25;state.program.nilIntegrity=45}if(name==='Trust Rebuild'){state.program.trust=38;state.program.culture=42}state.view='Dashboard';render()}
function exportSave(){document.getElementById('share').value=btoa(unescape(encodeURIComponent(JSON.stringify({week:state.week,season:state.season,program:state.program,record:state.record}))))}
function addCustom(){let v=document.getElementById('customName').value.trim();if(v){state.custom.push(v);save();render()}}
function saveScore(){let score=Math.round(state.program.trust+state.program.prestige+state.program.job+state.record[0]*10-state.record[1]*4);state.leaders.push({name:state.coach.name,score,arch:state.coach.archetype});state.leaders.sort((a,b)=>b.score-a.score);save();render()}
function advanceWeek(){let winChance=(state.program.culture+state.program.trust+state.players.reduce((a,p)=>a+p.ovr,0)/state.players.length)/3;let won=Math.random()*100<winChance;if(won)state.record[0]++;else state.record[1]++;state.week++;state.program.fan=clamp(state.program.fan+(won?4:-5));state.program.job=clamp(state.program.job+(won?3:-6));state.program.trust=clamp(state.program.trust+state.players.reduce((a,p)=>a+p.trust,0)/state.players.length/70-1);state.players.forEach(p=>{p.fatigue=clamp(p.fatigue+8);if(p.fatigue>70){p.morale=clamp(p.morale-5);p.portal=clamp(p.portal+5)}});state.recruits.forEach(r=>{if(r.debt>20){r.trust=clamp(r.trust-6);r.interest=clamp(r.interest-4)}});state.log.push(`Game result: ${won?'Win':'Loss'}. Weekly consequences applied.`);if(state.week>8){state.log.push('End of cycle reached. Use Dynasty → Run Offseason.');state.week=8}render()}
render();
</script>
</body>
</html>
