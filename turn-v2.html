<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>No Promises Turn V2</title><style>:root{--bg:#070a11;--card:#111827;--line:#2b3750;--text:#fff3e3;--muted:#9aa6ba;--orange:#ff8a2a;--gold:#ffd166;--green:#58db96;--red:#ff5d73;--blue:#67b7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 12% -10%,#202d49 0,#080b12 40%,#05070b 100%);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}button{font:inherit;cursor:pointer;border:1px solid var(--line);border-radius:12px;background:#11192a;color:var(--text);padding:9px 11px}button:hover{border-color:var(--orange)}.primary{background:linear-gradient(135deg,var(--orange),#ffb23f);color:#170f08;border-color:#ffc06a;font-weight:900}.danger{border-color:rgba(255,93,115,.6);color:#ffd8de}.app{max-width:1240px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:16px}.top h1{margin:0;font-size:34px;letter-spacing:-.05em}.muted,small{color:var(--muted)}.pill{border:1px solid var(--line);border-radius:999px;padding:8px 12px;color:var(--muted);background:rgba(255,255,255,.04)}.nav{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}.nav button.active{background:var(--orange);color:#140d07;font-weight:900}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:18px;padding:15px}.s3{grid-column:span 3}.s4{grid-column:span 4}.s6{grid-column:span 6}.s8{grid-column:span 8}.s12{grid-column:span 12}h2,h3{margin:0 0 10px}.kpi{font-size:36px;font-weight:1000;letter-spacing:-.06em}.bar{height:9px;background:#202a3d;border-radius:999px;overflow:hidden;margin:5px 0 10px}.fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--gold));border-radius:999px}.fill.good{background:linear-gradient(90deg,#27c979,#8af0b8)}.fill.bad{background:linear-gradient(90deg,var(--red),#ffad66)}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{display:inline-block;font-size:12px;margin:2px;padding:5px 8px;border-radius:999px;background:rgba(255,138,42,.13);border:1px solid rgba(255,138,42,.35);color:#ffd2ad}.green{background:rgba(88,219,150,.13);border-color:rgba(88,219,150,.35);color:#ddffe9}.blue{background:rgba(103,183,255,.13);border-color:rgba(103,183,255,.35);color:#d8ecff}.table{width:100%;border-collapse:collapse}.table th,.table td{border-bottom:1px solid var(--line);padding:9px;text-align:left;vertical-align:top}.table th{font-size:12px;text-transform:uppercase;color:var(--muted)}.feed{display:grid;gap:8px}.item{background:rgba(0,0,0,.17);border:1px solid var(--line);border-radius:13px;padding:10px}.task{min-height:148px;display:flex;flex-direction:column;gap:8px}.cost{font-weight:900;color:#110c08;background:linear-gradient(135deg,var(--gold),#ffb13b);border-radius:999px;padding:4px 8px;font-size:12px}.bigPoints{display:grid;place-items:center;border:1px solid rgba(255,138,42,.4);background:radial-gradient(circle,rgba(255,138,42,.18),rgba(255,255,255,.03));border-radius:20px;min-height:166px}.bigPoints b{font-size:60px;line-height:1;letter-spacing:-.08em}.disabled{opacity:.45;filter:grayscale(.4)}.footer{margin-top:18px;text-align:center;font-size:12px;color:var(--muted)}@media(max-width:900px){.s3,.s4,.s6,.s8{grid-column:span 12}.top{display:block}.app{padding:13px}.table{font-size:13px}}</style></head><body><div class='app'><div class='top'><div><h1>No Promises</h1><div class='muted'>Turn-based college basketball coach manager. Weekly task points drive every decision.</div></div><div class='pill'>Task Point Economy V2</div></div><div class='nav' id='nav'></div><main id='main'></main><div class='footer'>Local browser prototype. Saves on this device.</div></div><script>const clamp=n=>Math.max(0,Math.min(100,Math.round(n)));const avg=(a,k)=>a.reduce((s,x)=>s+(x[k]||0),0)/a.length;const start=()=>({view:'Turn',week:1,season:1,record:[0,0],prep:0,q:[],log:['Week 1: task points are live. Your program strength now determines your bandwidth.'],coach:{prestige:54,xp:420,level:3},program:{success:50,prestige:51,trust:66,culture:64,job:63,budget:72,staff:50,pressure:32,ad:58,boosters:54,nil:48,nilIntegrity:76,fan:57,academics:78},players:[['Reagan Williams','W','JR',84,76,82,63,18,22,'Quiet Leader'],['Damiya Carter','PG','SO',82,68,74,55,24,29,'Film Junkie'],['Lex Harper','F','SR',86,71,70,59,12,35,'Alpha'],['Galima Sato','F','FR',77,62,61,45,33,18,'Late Bloomer'],['Bre Morgan','G','JR',81,64,58,70,39,32,'Social Influencer']].map(x=>({name:x[0],pos:x[1],yr:x[2],ovr:x[3],morale:x[4],trust:x[5],nil:x[6],portal:x[7],fatigue:x[8],trait:x[9]})),recruits:[['Jada Ellis','CG','2027',62,48,84,50,22,0,'Playing time clarity'],['Skylar Reed','W','2027',58,44,76,48,28,0,'NIL visibility'],['Maya Brooks','PG','2028',66,52,88,60,16,0,'Belief + development'],['Alina Carter','F','2027',55,47,70,42,31,0,'Clear role path'],['Nia Thompson','PF','2028',50,46,91,64,18,0,'Overwhelmed by process']].map(x=>({name:x[0],pos:x[1],cls:x[2],interest:x[3],trust:x[4],fit:x[5],family:x[6],risk:x[7],debt:x[8],concern:x[9],hidden:false})),portal:[['Tessa King','PG',85,82,18,42,36],['Morgan Lee','C',83,74,12,50,28],['Aniyah West','W',81,88,9,48,22]].map(x=>({name:x[0],pos:x[1],ovr:x[2],fit:x[3],ask:x[4],trust:x[5],risk:x[6],status:'available'})),leaders:JSON.parse(localStorage.np_turn_v2_leaders||'[]')});let S=load();function load(){try{return JSON.parse(localStorage.np_turn_v2)||start()}catch(e){return start()}}function save(){localStorage.np_turn_v2=JSON.stringify(S);localStorage.np_turn_v2_leaders=JSON.stringify(S.leaders||[])}function debt(){return S.recruits.reduce((a,r)=>a+r.debt,0)}function formula(){let p=S.program,c=S.coach,f=avg(S.players,'fatigue'),w=S.record[0],l=S.record[1];let rows=[['Base bandwidth',16],['Program success',Math.floor(p.success/12)],['Program prestige',Math.floor(p.prestige/16)],['Coach prestige',Math.floor(c.prestige/14)],['Staff quality',Math.floor(p.staff/18)],['Trust capital',Math.floor(p.trust/24)],['Budget stability',Math.floor(p.budget/28)],['Winning momentum',Math.max(0,Math.floor((w-l)*1.5))],['Pressure penalty',-Math.floor(p.pressure/26)],['Fatigue penalty',-Math.floor(f/34)],['Trust debt penalty',-Math.floor(debt()/18)]];let total=Math.max(10,Math.min(42,rows.reduce((a,r)=>a+r[1],0)));return{rows,total}}function ensure(){if(typeof S.maxTP!='number'){let f=formula();S.maxTP=f.total;S.tp=f.total}}function newWeek(){let f=formula();S.maxTP=f.total;S.tp=f.total;S.q=[]}function log(x){S.log.push(x);if(S.log.length>24)S.log.shift()}function spend(cost,label,fn){if(S.tp<cost){log('Not enough TP for '+label+'. Need '+cost+', have '+S.tp+'.');render();return}S.tp-=cost;S.q.push({label,cost});fn&&fn();log('Task: '+label+' (-'+cost+' TP).');render()}function meter(label,val,bad=false){return `<small>${label}<b style='float:right'>${Math.round(val)}</b></small><div class='bar'><div class='fill ${bad?'bad':val>70?'good':''}' style='width:${clamp(val)}%'></div></div>`}function task(name,cost,desc,call,tags=''){let d=S.tp<cost;return `<div class='card task ${d?'disabled':''}'><div class='row'><h3>${name}</h3><span class='cost'>${cost} TP</span></div><div class='muted'>${desc}</div><div>${tags}</div><button class='${d?'':'primary'}' onclick="${call}">${d?'Need More TP':'Spend Points'}</button></div>`}const screens=['Turn','Roster','Recruiting','Portal','Practice','Program','Dynasty'];function drawNav(){document.getElementById('nav').innerHTML=screens.map(v=>`<button class='${S.view==v?'active':''}' onclick="go('${v}')">${v}</button>`).join('')+`<button class='primary' onclick='resolveWeek()'>Resolve Week</button><button class='danger' onclick='resetGame()'>Reset</button>`}function go(v){S.view=v;render()}function Turn(){let f=formula();return `<section class='grid'><div class='card s8'><h2>Week ${S.week}, Season ${S.season}: Turn Planning</h2><p class='muted'>Each week is a turn. Task points come from program success, coach prestige, staff quality, trust, budget, momentum, fatigue, pressure, and trust debt.</p><div class='grid'><div class='card s3'><div class='kpi'>${S.record[0]}-${S.record[1]}</div><small>Record</small></div><div class='card s3'><div class='kpi'>${S.program.success}</div><small>Success</small></div><div class='card s3'><div class='kpi'>${S.coach.prestige}</div><small>Coach Prestige</small></div><div class='card s3'><div class='kpi'>${debt()}</div><small>Trust Debt</small></div></div></div><div class='bigPoints s4'><b>${S.tp}</b><span class='muted'>Task Points Left</span><span class='tag'>${S.maxTP} weekly budget</span></div><div class='card s4'><h3>Point Formula</h3>${f.rows.map(r=>`<div class='row'><small>${r[0]}</small><b>${r[1]>0?'+':''}${r[1]}</b></div>`).join('')}</div><div class='card s4'><h3>Completed Tasks</h3><div class='feed'>${S.q.length?S.q.map(t=>`<div class='item'>${t.label} <span class='tag'>${t.cost} TP</span></div>`).join(''):'<div class=item>No tasks yet.</div>'}</div></div><div class='card s4'><h3>Program Pulse</h3>${meter('Trust',S.program.trust)}${meter('Culture',S.program.culture)}${meter('Pressure',S.program.pressure,true)}</div><div class='s12 grid'>${task('Game Prep',6,'Scout opponent and boost win probability.',"prog('prep')",'<span class="tag green">Winning</span>')}${task('Culture Day',5,'Raise morale and lower portal risk.',"prog('culture')",'<span class="tag">Trust</span>')}${task('Booster Touchpoint',5,'Increase budget, but add pressure.',"prog('booster')",'<span class="tag blue">Money</span>')}${task('Academic Support',4,'Protect eligibility and AD confidence.',"prog('academics')",'<span class="tag green">Stability</span>')}</div><div class='card s12'><h3>Feed</h3><div class='feed'>${S.log.slice(-8).reverse().map(x=>`<div class='item'>${x}</div>`).join('')}</div></div></section>`}function Roster(){return `<section class='grid'><div class='card s12'><h2>Roster Tasks</h2><table class='table'><tr><th>Player</th><th>OVR</th><th>Morale</th><th>Trust</th><th>NIL</th><th>Fatigue</th><th>Portal</th><th>Tasks</th></tr>${S.players.map((p,i)=>`<tr><td><b>${p.name}</b><br><small>${p.yr} · ${p.pos} · ${p.trait}</small></td><td>${p.ovr}</td><td>${p.morale}</td><td>${p.trust}</td><td>${p.nil}</td><td>${p.fatigue}</td><td>${p.portal}%</td><td><button onclick="player(${i},'role')">Role · 4</button> <button onclick="player(${i},'dev')">Dev · 5</button> <button onclick="player(${i},'nil')">NIL · 4</button> <button onclick="player(${i},'rec')">Recovery · 3</button></td></tr>`).join('')}</table></div></section>`}function player(i,t){let p=S.players[i],c={role:4,dev:5,nil:4,rec:3}[t];spend(c,t+' task for '+p.name,()=>{if(t=='role'){p.trust=clamp(p.trust+9);p.morale=clamp(p.morale+6);p.portal=clamp(p.portal-9);S.program.trust=clamp(S.program.trust+2)}if(t=='dev'){p.ovr=clamp(p.ovr+1);p.morale=clamp(p.morale+3);p.fatigue=clamp(p.fatigue+4);S.program.success=clamp(S.program.success+1)}if(t=='nil'){p.nil=clamp(p.nil+10);p.portal=clamp(p.portal-6);S.program.nil=clamp(S.program.nil-2);S.program.nilIntegrity=clamp(S.program.nilIntegrity+1)}if(t=='rec'){p.fatigue=clamp(p.fatigue-18);p.morale=clamp(p.morale+2)}})}function Recruiting(){return `<section class='grid'><div class='card s12'><h2>Recruiting Tasks</h2><table class='table'><tr><th>Recruit</th><th>Interest</th><th>Trust</th><th>Fit</th><th>Family</th><th>Risk</th><th>Debt</th><th>Concern</th><th>Tasks</th></tr>${S.recruits.map((r,i)=>`<tr><td><b>${r.name}</b><br><small>${r.cls} · ${r.pos}</small></td><td>${r.interest}</td><td>${r.trust}</td><td>${r.fit}</td><td>${r.family}</td><td>${r.risk}</td><td>${r.debt}</td><td>${r.concern}${r.hidden?' <span class="tag green">revealed</span>':''}</td><td><button onclick="rec(${i},'text')">Text · 2</button> <button onclick="rec(${i},'call')">Call · 4</button> <button onclick="rec(${i},'plan')">Plan · 6</button> <button onclick="rec(${i},'hc')">HC · 8</button> <button onclick="rec(${i},'visit')">Visit · 7</button></td></tr>`).join('')}</table></div></section>`}function rec(i,t){let r=S.recruits[i],c={text:2,call:4,plan:6,hc:8,visit:7}[t];spend(c,t+' with '+r.name,()=>{if(t=='text'){r.interest=clamp(r.interest+3);r.trust=clamp(r.trust+2)}if(t=='call'){r.trust=clamp(r.trust+7);r.family=clamp(r.family+3);r.hidden=true}if(t=='plan'){r.trust=clamp(r.trust+10);r.interest=clamp(r.interest+5);r.fit=clamp(r.fit+3);r.risk=clamp(r.risk-5);r.debt=clamp(r.debt-4);r.hidden=true}if(t=='hc'){if(r.trust<48){r.interest=clamp(r.interest+5);r.debt=clamp(r.debt+6);r.risk=clamp(r.risk+5);log(r.name+': HC touch felt early. Trust debt created.')}else{r.interest=clamp(r.interest+12);r.trust=clamp(r.trust+5)}}if(t=='visit'){if(r.trust<50){r.risk=clamp(r.risk+8);r.debt=clamp(r.debt+6)}else{r.interest=clamp(r.interest+12);r.family=clamp(r.family+4)}}})}function Portal(){return `<section class='grid'><div class='card s8'><h2>Transfer Portal</h2><table class='table'><tr><th>Target</th><th>OVR</th><th>Fit</th><th>NIL Ask</th><th>Trust</th><th>Risk</th><th>Status</th><th>Tasks</th></tr>${S.portal.map((p,i)=>`<tr><td><b>${p.name}</b><br><small>${p.pos}</small></td><td>${p.ovr}</td><td>${p.fit}</td><td>$${p.ask}k</td><td>${p.trust}</td><td>${p.risk}</td><td>${p.status}</td><td><button onclick="port(${i},'scout')">Scout · 4</button> <button onclick="port(${i},'pitch')">Pitch · 7</button> <button onclick="port(${i},'offer')">Offer · 10</button></td></tr>`).join('')}</table></div><div class='card s4'><h3>Retention Watch</h3><div class='feed'>${S.players.filter(p=>p.portal>25).map(p=>`<div class='item'><b>${p.name}</b><br><small>Portal Risk ${p.portal}%</small></div>`).join('')||'<div class=item>No major portal alerts.</div>'}</div></div></section>`}function port(i,t){let p=S.portal[i],c={scout:4,pitch:7,offer:10}[t];spend(c,t+' '+p.name,()=>{if(t=='scout'){p.trust=clamp(p.trust+5);p.risk=clamp(p.risk-4);S.program.staff=clamp(S.program.staff+1)}if(t=='pitch'){p.trust=clamp(p.trust+11);p.risk=clamp(p.risk-8);S.program.nilIntegrity=clamp(S.program.nilIntegrity+2)}if(t=='offer'){if(S.program.nil<p.ask){p.risk=clamp(p.risk+7);S.program.nilIntegrity=clamp(S.program.nilIntegrity-4);log(p.name+': underfunded NIL offer hurt credibility.');return}if(p.trust+p.fit-p.risk>115&&p.status!='committed'){p.status='committed';S.program.nil=clamp(S.program.nil-p.ask/2);S.players.push({name:p.name,pos:p.pos,yr:'TR',ovr:p.ovr,morale:66,trust:p.trust,nil:62,portal:18,fatigue:10,trait:'Portal Add'});S.program.prestige=clamp(S.program.prestige+4);log(p.name+' committed from the portal.')}else log(p.name+' needs more trust before committing.')}})}function Practice(){return `<section class='grid'><div class='card s12'><h2>Practice Tasks</h2><p class='muted'>Practice competes with recruiting, portal, NIL, and politics for the same weekly task points.</p></div><div class='s12 grid'>${task('Skill Block',5,'Improve guards/wings but add fatigue.',"prac('skill')",'<span class="tag green">Development</span>')}${task('Defensive Identity',6,'Build culture and game prep.',"prac('def')",'<span class="tag">Culture</span>')}${task('Ball Screen Reads',5,'Improve guards and offensive IQ.',"prac('reads')",'<span class="tag blue">IQ</span>')}${task('Recovery + Film',4,'Lower fatigue and sharpen prep.',"prac('rec')",'<span class="tag green">Health</span>')}</div></section>`}function prac(t){spend({skill:5,def:6,reads:5,rec:4}[t],'practice: '+t,()=>{if(t=='skill'){S.players.forEach(p=>{if(['G','PG','W'].includes(p.pos))p.ovr=clamp(p.ovr+1);p.fatigue=clamp(p.fatigue+4)});S.program.success=clamp(S.program.success+1)}if(t=='def'){S.program.culture=clamp(S.program.culture+5);S.prep=clamp(S.prep+7);S.players.forEach(p=>p.fatigue=clamp(p.fatigue+5))}if(t=='reads'){S.players.forEach(p=>{if(['PG','G','CG'].includes(p.pos)){p.ovr=clamp(p.ovr+1);p.trust=clamp(p.trust+2)}});S.prep=clamp(S.prep+4)}if(t=='rec'){S.players.forEach(p=>p.fatigue=clamp(p.fatigue-12));S.prep=clamp(S.prep+3)}})}function Program(){return `<section class='grid'><div class='card s4'><h2>Program Health</h2>${meter('Trust',S.program.trust)}${meter('Culture',S.program.culture)}${meter('Budget',S.program.budget,true)}${meter('Pressure',S.program.pressure,true)}</div><div class='card s4'><h2>Power</h2>${meter('AD Trust',S.program.ad)}${meter('Booster Trust',S.program.boosters)}${meter('NIL Integrity',S.program.nilIntegrity)}${meter('Academics',S.program.academics)}</div><div class='card s4'><h2>Program Tasks</h2><button onclick="prog('ad')">AD Memo · 5</button><br><br><button onclick="prog('media')">Media · 4</button><br><br><button onclick="prog('nil')">NIL Audit · 5</button><br><br><button onclick="prog('staff')">Staff Alignment · 4</button></div></section>`}function prog(t){let c={prep:6,culture:5,booster:5,academics:4,ad:5,media:4,nil:5,staff:4}[t];spend(c,'program: '+t,()=>{let p=S.program;if(t=='prep'){S.prep=clamp(S.prep+12);p.success=clamp(p.success+1)}if(t=='culture'){p.culture=clamp(p.culture+8);p.trust=clamp(p.trust+4);S.players.forEach(x=>{x.morale=clamp(x.morale+4);x.portal=clamp(x.portal-5)})}if(t=='booster'){p.boosters=clamp(p.boosters+8);p.budget=clamp(p.budget+6);p.pressure=clamp(p.pressure+4)}if(t=='academics'){p.academics=clamp(p.academics+8);p.ad=clamp(p.ad+3);p.job=clamp(p.job+2)}if(t=='ad'){p.ad=clamp(p.ad+8);p.job=clamp(p.job+4)}if(t=='media'){p.fan=clamp(p.fan+7);p.pressure=clamp(p.pressure+5);S.coach.prestige=clamp(S.coach.prestige+2)}if(t=='nil'){p.nilIntegrity=clamp(p.nilIntegrity+9);p.nil=clamp(p.nil+3);p.boosters=clamp(p.boosters+2)}if(t=='staff'){p.staff=clamp(p.staff+6);p.trust=clamp(p.trust+2)}})}function Dynasty(){return `<section class='grid'><div class='card s8'><h2>Dynasty</h2><p class='muted'>Coach prestige feeds next week’s points. Strong programs get more bandwidth; chaotic programs spend weeks putting out fires.</p><div class='grid'><div class='card s3'><div class='kpi'>${S.season}</div><small>Season</small></div><div class='card s3'><div class='kpi'>${S.coach.level}</div><small>Level</small></div><div class='card s3'><div class='kpi'>${S.coach.xp}</div><small>XP</small></div><div class='card s3'><div class='kpi'>${S.coach.prestige}</div><small>Prestige</small></div></div><br><button class='primary' onclick='offseason()'>Run Offseason · 8 TP</button></div><div class='card s4'><h3>Score</h3><button onclick='saveScore()'>Save Score</button><div class='feed'>${S.leaders.map(l=>`<div class='item'><b>${l.score}</b> — Coach KM<br><small>${l.week}</small></div>`).join('')}</div></div></section>`}function offseason(){spend(8,'offseason',()=>{S.season++;S.week=1;S.coach.xp+=180;S.coach.level=Math.floor(S.coach.xp/250)+1;S.coach.prestige=clamp(S.coach.prestige+S.record[0]*2-S.record[1]+S.program.trust/20);S.program.prestige=clamp(S.program.prestige+S.record[0]*2-S.record[1]);S.record=[0,0];S.prep=0;newWeek();log('Offseason complete. New season opened with recalculated task points.')})}function weeklyEvent(won){let e=Math.random();if(e<.25){let r=S.recruits[Math.floor(Math.random()*S.recruits.length)];r.risk=clamp(r.risk+6);log(r.name+' heard another school promise a bigger role.')}else if(e<.5){let p=S.players.reduce((a,b)=>a.portal>b.portal?a:b);p.portal=clamp(p.portal+6);log(p.name+' is hearing portal noise.')}else if(e<.7){S.program.boosters=clamp(S.program.boosters+(won?4:-5));log('Boosters '+(won?'liked the momentum.':'are getting restless.'))}else if(e<.85){S.program.academics=clamp(S.program.academics-4);log('Academic staff flagged missed study hall energy.')}else{S.program.nil=clamp(S.program.nil+5);log('Local sponsor interest increased the NIL fund.')}}function resolveWeek(){let chance=30+avg(S.players,'ovr')/2+S.program.culture/8+S.program.trust/10+S.prep/2+S.program.staff/12-avg(S.players,'fatigue')/3-S.program.pressure/10;chance=Math.max(12,Math.min(88,chance));let won=Math.random()*100<chance;if(won){S.record[0]++;S.program.success=clamp(S.program.success+5);S.program.fan=clamp(S.program.fan+5);S.program.job=clamp(S.program.job+4);S.program.prestige=clamp(S.program.prestige+2);S.coach.prestige=clamp(S.coach.prestige+1);log('WIN. Win probability was '+Math.round(chance)+'%.')}else{S.record[1]++;S.program.success=clamp(S.program.success-4);S.program.fan=clamp(S.program.fan-5);S.program.job=clamp(S.program.job-6);S.program.pressure=clamp(S.program.pressure+5);log('LOSS. Win probability was '+Math.round(chance)+'%.')}S.players.forEach(p=>{p.fatigue=clamp(p.fatigue+8);if(p.fatigue>70){p.morale=clamp(p.morale-6);p.portal=clamp(p.portal+7)}if(p.trust<55)p.portal=clamp(p.portal+3)});S.recruits.forEach(r=>{if(r.debt>18){r.trust=clamp(r.trust-5);r.interest=clamp(r.interest-3);r.risk=clamp(r.risk+4)}});weeklyEvent(won);S.prep=0;S.week++;if(S.week>12){S.week=12;log('Regular season complete. Use Dynasty to run the offseason.')}newWeek();S.view='Turn';render()}function saveScore(){let score=Math.round(S.program.trust+S.program.prestige+S.program.job+S.program.success+S.coach.prestige+S.record[0]*10-S.record[1]*5-debt());S.leaders.push({score,week:'S'+S.season+' W'+S.week});S.leaders.sort((a,b)=>b.score-a.score);render()}function resetGame(){if(confirm('Reset this turn-based save?')){localStorage.removeItem('np_turn_v2');S=start();newWeek();render()}}function render(){ensure();drawNav();document.getElementById('main').innerHTML=({Turn,Roster,Recruiting,Portal,Practice,Program,Dynasty})[S.view]();save()}render();</script></body></html>
