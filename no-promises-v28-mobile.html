<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101d">
<title>No Promises — Loading V28.3 Beta</title>
<style>
:root{color-scheme:dark;--bg:#06101d;--text:#f7f9fc;--muted:#9eacbd;--orange:#ff7f32;--gold:#ffc75f;--blue:#77c4ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 12% 0,rgba(119,196,255,.22),transparent 30%),radial-gradient(circle at 100% 0,rgba(255,127,50,.22),transparent 28%),linear-gradient(180deg,#091525,var(--bg));font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}.loader{width:min(520px,100%);padding:26px;border-radius:30px;border:1px solid rgba(255,255,255,.13);background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.035));box-shadow:0 28px 80px rgba(0,0,0,.38)}.pill{display:inline-flex;padding:7px 10px;border:1px solid rgba(255,255,255,.14);border-radius:999px;background:rgba(255,255,255,.05);font-size:11px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:#e4edf7}h1{font-size:clamp(42px,12vw,68px);line-height:.88;letter-spacing:-.09em;margin:20px 0 14px}p{color:var(--muted);line-height:1.5;margin:0}.track{height:11px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden;margin:24px 0 10px}.fill{height:100%;width:5%;border-radius:inherit;background:linear-gradient(90deg,var(--orange),var(--gold),var(--blue));transition:width .22s ease}.status{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:#d9e4f0}.error{display:none;margin-top:18px;padding:14px;border:1px solid rgba(255,105,127,.35);border-radius:18px;background:rgba(255,105,127,.10);color:#ffdce2}.error button{width:100%;margin-top:12px;min-height:44px;border:0;border-radius:999px;background:linear-gradient(135deg,var(--orange),var(--gold));color:#1b1007;font-weight:900;font-size:15px}@media(prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>
<main class="loader">
<span class="pill">No Promises · V28.3.5 Recovery Build</span>
<h1>Building your program.</h1>
<p>Detecting the deployed game format and loading the full mobile beta.</p>
<div class="track"><div class="fill" id="fill"></div></div>
<div class="status"><span id="status">Connecting…</span><b id="percent">5%</b></div>
<div class="error" id="error"><b>We couldn’t load the beta.</b><br><span id="errorText"></span><button onclick="location.reload()">Try Again</button></div>
</main>
<script>
(async()=>{
 const count=21,base='no-promises-v28-3-beta/',build='28.3.5',fill=document.getElementById('fill'),status=document.getElementById('status'),percent=document.getElementById('percent');
 const set=(n,t)=>{fill.style.width=n+'%';percent.textContent=Math.round(n)+'%';status.textContent=t};
 const alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';
 const decodeBase64=value=>{
  const clean=value.replace(/\s+/g,'').replace(/=+$/,'');
  if(!clean||!/^[A-Za-z0-9+/]+$/.test(clean))throw new Error('A game section contains invalid characters.');
  const out=[];let buffer=0,bits=0;
  for(let i=0;i<clean.length;i++){
   const code=alphabet.indexOf(clean[i]);
   buffer=buffer*64+code;bits+=6;
   while(bits>=8){bits-=8;const divisor=Math.pow(2,bits);out.push(Math.floor(buffer/divisor)&255);buffer%=divisor;}
  }
  return new Uint8Array(out);
 };
 const concat=chunks=>{const total=chunks.reduce((n,c)=>n+c.length,0),out=new Uint8Array(total);let at=0;for(const c of chunks){out.set(c,at);at+=c.length}return out};
 const loadScript=url=>new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=url;s.async=true;s.onload=resolve;s.onerror=reject;document.head.appendChild(s)});
 const getPako=async()=>{if(window.pako)return window.pako;try{await loadScript('https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js')}catch(e){await loadScript('https://unpkg.com/pako@2.1.0/dist/pako.min.js')}if(!window.pako)throw new Error('The decompression library could not load.');return window.pako};
 const valid=html=>typeof html==='string'&&html.includes('<!doctype html')&&html.includes('V28.3')&&html.includes('Beta Test');
 const textOf=bytes=>{try{return new TextDecoder('utf-8',{fatal:true}).decode(bytes)}catch(e){return ''}};
 const tryWhole=(pako,bytes)=>{
  const direct=textOf(bytes);if(valid(direct))return direct;
  const methods=[['auto',()=>pako.inflate(bytes,{to:'string'})],['gzip',()=>pako.ungzip(bytes,{to:'string'})],['raw',()=>pako.inflateRaw(bytes,{to:'string'})]];
  for(const [name,fn] of methods){try{const html=fn();if(valid(html))return html}catch(e){console.warn(name,e)}}
  return '';
 };
 try{
  set(8,'Downloading game sections…');
  const encoded=[];
  for(let i=0;i<count;i++){
   const response=await fetch(base+`part-${String(i).padStart(2,'0')}.txt?build=${build}`,{cache:'no-store'});
   if(!response.ok)throw new Error(`Missing game section ${i+1} of ${count}.`);
   encoded.push((await response.text()).trim());
   set(8+60*((i+1)/count),`Downloading section ${i+1} of ${count}…`);
  }
  set(72,'Inspecting game data…');
  const decoded=encoded.map(decodeBase64),pako=await getPako();
  let html=tryWhole(pako,concat(decoded));
  if(!html){
   set(82,'Trying section-by-section recovery…');
   const recovered=[];
   for(const bytes of decoded){
    let part=textOf(bytes);
    if(!part){for(const fn of [()=>pako.inflate(bytes,{to:'string'}),()=>pako.ungzip(bytes,{to:'string'}),()=>pako.inflateRaw(bytes,{to:'string'})]){try{part=fn();if(part)break}catch(e){}}}
    if(!part){recovered.length=0;break}recovered.push(part);
   }
   const joined=recovered.join('');if(valid(joined))html=joined;
  }
  if(!html){
   set(88,'Trying combined-stream recovery…');
   const joinedEncoding=encoded.map(x=>x.replace(/=+$/,'')).join('');
   html=tryWhole(pako,decodeBase64(joinedEncoding));
  }
  if(!valid(html))throw new Error('The deployed payload format does not match the validated game build.');
  set(98,'Starting your dynasty…');
  document.open();document.write(html);document.close();
 }catch(err){console.error(err);set(100,'Load failed');document.getElementById('errorText').textContent=err.message;document.getElementById('error').style.display='block'}
})();
</script>
</body>
</html>
